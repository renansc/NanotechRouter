<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · NanotechRouter</title>
<style>body{font:16px system-ui;background:#f2f5f9;color:#172b45;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:white;padding:36px;border-radius:14px;width:min(340px,80vw);box-shadow:0 8px 35px #17385c18}h1{font-size:25px}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5df;border-radius:7px;font:inherit}button{background:#1658be;color:white;margin-top:24px;cursor:pointer}.error{color:#a72020}small{color:#657489}</style></head>
<body><main class="box"><h1>NanotechRouter</h1><p>Administração da rede</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button>Entrar</button></form><p><small>Use suas credenciais de administrador.</small></p></main></body></html>
