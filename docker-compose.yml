services:

  router-core:
    build:
      context: ./core
    container_name: nanotechrouter-core
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ./data:/srv/nanotechsoft/router/data
      - ./config:/srv/nanotechsoft/router/config
      - /run:/run
    environment:
      - TZ=America/Sao_Paulo
      - ROUTER_BASE=/srv/nanotechsoft/router
      - ROUTER_API_TOKEN=${ROUTER_API_TOKEN:?Defina ROUTER_API_TOKEN no arquivo .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5050/api/interfaces >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  router-web:
    build:
      context: ./web
    container_name: linux-router-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      router-core:
        condition: service_healthy
    volumes:
      - ./data:/data
    environment:
      - TZ=America/Sao_Paulo
      - ROUTER_SECRET_KEY=${ROUTER_SECRET_KEY:?Defina ROUTER_SECRET_KEY no arquivo .env}
      - ROUTER_API_TOKEN=${ROUTER_API_TOKEN:?Defina ROUTER_API_TOKEN no arquivo .env}
